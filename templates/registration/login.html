{% extends 'base.html' %}

{% block title %}Entrar — ImobiliáriaWeb{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-buildings-fill text-dark" style="font-size: 2.5rem;"></i>
                    <h3 class="mt-2 fw-bold">Entrar</h3>
                    <p class="text-muted small">Acesse sua conta para ver mais detalhes</p>
                </div>

                {% if form.errors %}
                <div class="alert alert-danger" role="alert">
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    Usuário ou senha inválidos. Tente novamente.
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">

                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-semibold">Usuário</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" id="id_username"
                                   class="form-control" placeholder="Seu usuário" autofocus required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label fw-semibold">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" id="id_password"
                                   class="form-control" placeholder="Sua senha" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-dark w-100">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
